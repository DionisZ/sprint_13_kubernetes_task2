apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U webapp -d webapp; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: webapp
          image: ghcr.io/practical-devops/k8/web-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RAILS_ENV
              value: production
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: webapp
            - name: DB_USER
              value: webapp
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: db-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: secret-key-base
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /data
              port: 3000
            periodSeconds: 3
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 3000
